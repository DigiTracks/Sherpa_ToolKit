function calcMakeBuy(){
  const bPrice=nz(document.getElementById('mb-bprice').value);
  const qty=nz(document.getElementById('mb-qty').value);
  const freight=nz(document.getElementById('mb-freight').value);
  const insp=nz(document.getElementById('mb-insp').value);
  const admin=nz(document.getElementById('mb-admin').value);
  const buffer=nz(document.getElementById('mb-buffer').value);
  const mat=nz(document.getElementById('mb-mat').value);
  const lab=nz(document.getElementById('mb-lab').value);
  const mach=nz(document.getElementById('mb-mach').value);
  const fixed=nz(document.getElementById('mb-fixed').value);
  const learn=nz(document.getElementById('mb-learn').value);
  const rework=nz(document.getElementById('mb-rework').value);
  const depr=nz(document.getElementById('mb-depr').value);

  const buyUnit=bPrice+freight+insp+admin;
  const buyTotal=(buyUnit*qty)+buffer;
  const makeUnit=mat+lab+mach+rework;
  const makeTotal=(makeUnit*qty)+fixed+learn+depr;
  const diff=buyTotal-makeTotal;
  const diffUnit=qty>0?diff/qty:0;
  const denom=buyUnit-makeUnit; const breakevenQty=(fixed+learn+depr)>0&&denom!==0?(fixed+learn+depr)/denom:0;

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Buy: Total Cost</div><div class="kv">₹${fmt(buyTotal)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Buy: Unit Cost</div><div class="kv">₹${fmt(buyUnit)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Make: Total Cost</div><div class="kv">₹${fmt(makeTotal)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Make: Unit Cost</div><div class="kv">₹${fmt(makeUnit)}</div></div>`;
  r+=`<div class="kpi ${diff>0?'pos':'neg'}"><div class="kl">${diff>0?'Make Saves':'Buy Saves'}</div><div class="kv">₹${fmt(Math.abs(diff))}</div><div class="ks">${diff>0?'Make is cheaper':'Buy is cheaper'}</div></div>`;
  r+=`</div>`;
  r+=`<div class="result-box mt-8"><h4>Decision Summary</h4><div class="table-wrap"><table class="data-table"><thead><tr><th>Component</th><th>Buy</th><th>Make</th></tr></thead><tbody>`;
  r+=`<tr><td>Unit Variable Cost</td><td>₹${fmt(buyUnit)}</td><td>₹${fmt(makeUnit)}</td></tr>`;
  r+=`<tr><td>Total Variable</td><td>₹${fmt(buyUnit*qty)}</td><td>₹${fmt(makeUnit*qty)}</td></tr>`;
  r+=`<tr><td>Fixed / One-time</td><td>₹${fmt(buffer)}</td><td>₹${fmt(fixed+learn+depr)}</td></tr>`;
  r+=`<tr class="font-bold"><td>Total Annual Cost</td><td>₹${fmt(buyTotal)}</td><td>₹${fmt(makeTotal)}</td></tr>`;
  r+=`</tbody></table></div></div>`;
  if(breakevenQty>0&&isFinite(breakevenQty))r+=`<div class="result-box mt-8"><h4>Break-Even Analysis</h4><p class="text-sm" style="color:var(--text2)">If making in-house: fixed + one-time costs are ₹${fmt(fixed+learn+depr)}. Variable cost difference: ₹${fmt(buyUnit-makeUnit)}/unit. Break-even at <strong>${fmt(Math.ceil(breakevenQty))} units</strong>.</p></div>`;
  document.getElementById('mb-result').innerHTML=r;
}

function calcScorecard(){
  const name=document.getElementById('sc-name').value||'Supplier';
  const weights=document.querySelectorAll('.sc-weight');
  const scores=document.querySelectorAll('.sc-score');
  let totalWeight=0;let totalScore=0;
  const rows=[];
  weights.forEach((w,i)=>{
    const wt=nz(w.value);
    const sc=nz(scores[i].value);
    totalWeight+=wt;
    totalScore+=wt*sc;
    rows.push({weight:wt,score:sc,weighted:wt*sc});
  });
  const finalScore=totalWeight>0?totalScore/totalWeight:0;
  const grade=finalScore>=4.5?'A+':finalScore>=4?'A':finalScore>=3.5?'B+':finalScore>=3?'B':finalScore>=2.5?'C+':finalScore>=2?'C':'D';
  const gradeColor=grade.startsWith('A')?'text-safe':grade.startsWith('B')?'text-pri':'text-danger';

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi pos"><div class="kl">Weighted Score</div><div class="kv">${finalScore.toFixed(2)} / 5</div><div class="ks">Grade: <span class="${gradeColor} font-bold">${grade}</span></div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Criteria</th><th>Weight</th><th>Score</th><th>Weighted</th><th>Performance</th></tr></thead><tbody>`;
  rows.forEach((r_,i)=>{
    const perf=r_.score>=4.5?'Excellent':r_.score>=3.5?'Good':r_.score>=2.5?'Average':r_.score>=1.5?'Poor':'Critical';
    const perfClass=r_.score>=4.5?'text-safe':r_.score>=3.5?'text-pri':r_.score>=2.5?'text-muted':r_.score>=1.5?'text-warn':'text-danger';
    r+=`<tr><td class="font-bold">${document.querySelectorAll('tr td:first-child')[i]?.textContent||'Criteria '+(i+1)}</td><td>${r_.weight}%</td><td>${r_.score||'--'}</td><td>${r_.score?(r_.weighted/5).toFixed(2):'--'}</td><td class="${perfClass}">${perf}</td></tr>`;
  });
  r+=`</tbody></table></div></div>`;
  if(finalScore<3)r+=`<div class="result-box mt-8"><h4>⚠ Score Below Threshold</h4><p class="text-sm" style="color:var(--text2)">Score below 3/5 indicates performance concerns. Consider issuing a corrective action plan or evaluating alternative suppliers.</p></div>`;
  document.getElementById('sc-result').innerHTML=r;
}
function loadSCardExample(){document.getElementById('sc-name').value='Tata Steel';const weights=[20,20,15,10,10,10,10,5];const scores=[4,3,4,4,3,4,5,3];weights.forEach((w,i)=>{document.querySelectorAll('.sc-weight')[i].value=w;document.querySelectorAll('.sc-score')[i].value=scores[i]});calcScorecard()}

function addConcSup(){

function calcConcentration(){
  const cat=document.getElementById('conc-cat').value||'Category';
  const names=document.querySelectorAll('.conc-name');
  const spends=document.querySelectorAll('.conc-spend');
  const suppliers=[];let totalSpend=0;
  names.forEach((n,i)=>{
    const s=nz(spends[i].value);
    if(s>0){suppliers.push({name:n.value||'Supplier '+(i+1),spend:s});totalSpend+=s}
  });
  suppliers.sort((a,b)=>b.spend-a.spend);
  suppliers.forEach(s=>s.share=totalSpend>0?(s.spend/totalSpend)*100:0);

  // HHI: sum of squared market shares
  const hhi=suppliers.reduce((sum,s)=>sum+Math.pow(s.share,2),0);
  const cr1=suppliers.length>0?suppliers[0].share:0;
  const cr3=suppliers.slice(0,3).reduce((sum,s)=>sum+s.share,0);

  let hhiLevel='Low';let hhiClass='text-safe';
  if(hhi>2500){hhiLevel='High (Concentrated)';hhiClass='text-danger'}
  else if(hhi>1500){hhiLevel='Moderate';hhiClass='text-warn'}

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Total Category Spend</div><div class="kv">₹${fmt(totalSpend)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Number of Suppliers</div><div class="kv">${suppliers.length}</div></div>`;
  r+=`<div class="kpi ${hhiClass}"><div class="kl">HHI Score</div><div class="kv">${fmt(hhi)}</div><div class="ks">${hhiLevel}</div></div>`;
  r+=`<div class="kpi"><div class="kl">CR1 (Top Supplier)</div><div class="kv">${fmtPct(cr1)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">CR3 (Top 3)</div><div class="kv">${fmtPct(cr3)}</div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Supplier</th><th>Annual Spend</th><th>Share</th><th>Squared Share</th><th>Risk</th></tr></thead><tbody>`;
  suppliers.forEach(s=>{
    const risk=s.share>40?'High':s.share>25?'Medium':'Low';
    const riskClass=s.share>40?'text-danger':s.share>25?'text-warn':'text-safe';
    r+=`<tr><td class="font-bold">${safe(s.name)}</td><td>₹${fmt(s.spend)}</td><td>${fmtPct(s.share)}</td><td>${fmt(s.share*s.share)}</td><td class="${riskClass}">${risk}</td></tr>`;
  });
  r+=`</tbody></table></div></div>`;

function rBudget(){
  let h=`<div class="section-header"><h3>Budget vs Actual Comparison</h3><div class="actions"><button class="btn btn-sec" onclick="nav(\'home\')" style="font-size:11px">Back</button><button class="btn btn-pri btn-sm" onclick="window.print()">Print</button><button class="btn btn-pri btn-sm" onclick="loadBudgetExample()">Load Example</button></div></div>`;
  h+=`<div class="card"><div class="form-grid">`;
  h+=`<div class="form-group"><label>Category / Line Item</label><input id="bv-item" value="" placeholder="e.g. Raw Materials"></div>`;
  h+=`<div class="form-group"><label>Period</label><input id="bv-period" value="" placeholder="e.g. Q3 FY27"></div>`;
  h+=`<div class="form-group"><label>Budgeted Spend</label><input id="bv-budget" type="number" value="" min="0" step="any"></div>`;
  h+=`<div class="form-group"><label>Actual Spend</label><input id="bv-actual" type="number" value="" min="0" step="any"></div>`;
  h+=`<div class="form-group"><label>Budgeted Volume (units)</label><input id="bv-bvol" type="number" value="" min="0" step="any"></div>`;
  h+=`<div class="form-group"><label>Actual Volume (units)</label><input id="bv-avol" type="number" value="" min="0" step="any"></div>`;
  h+=`</div></div>`;
  h+=`<div class="mt-12"><button class="btn btn-pri" onclick="calcBudget()">Compare</button></div>`;
  h+=`<div id="bv-result"></div>`;
  h+=dnote("Budget variance from price vs volume should be analyzed separately. A total variance of zero could mask a price overrun offset by volume savings.");
  h+=DISCLAIMER;
  return h;
}
function calcBudget(){
  const item=document.getElementById('bv-item').value||'Category';
  const period=document.getElementById('bv-period').value||'Period';
  const budget=nz(document.getElementById('bv-budget').value);
  const actual=nz(document.getElementById('bv-actual').value);
  const bVol=nz(document.getElementById('bv-bvol').value);
  const aVol=nz(document.getElementById('bv-avol').value);
  const variance=actual-budget;
  const varPct=budget>0?(variance/budget)*100:0;
  const budgetUnit=bVol>0?budget/bVol:0;
  const actualUnit=aVol>0?actual/aVol:0;
  const priceVar=aVol>0?(actualUnit-budgetUnit)*aVol:0;
  const volVar=budgetUnit>0?(aVol-bVol)*budgetUnit:0;
  const totalVar=priceVar+volVar;

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Budget</div><div class="kv">₹${fmt(budget)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Actual</div><div class="kv">₹${fmt(actual)}</div></div>`;
  r+=`<div class="kpi ${variance>0?'neg':'pos'}"><div class="kl">Variance</div><div class="kv">${variance>=0?'+':''}₹${fmt(variance)}</div><div class="ks">${fmtPct(varPct)}</div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Metric</th><th>Budget</th><th>Actual</th><th>Variance</th></tr></thead><tbody>`;
  r+=`<tr><td>Total Spend</td><td>₹${fmt(budget)}</td><td>₹${fmt(actual)}</td><td class="${variance>0?'text-danger':'text-safe'}">${variance>=0?'+':''}₹${fmt(variance)}</td></tr>`;
  r+=`<tr><td>Volume</td><td>${fmt(bVol)}</td><td>${fmt(aVol)}</td><td>${aVol>=bVol?'+':''}${fmt(aVol-bVol)}</td></tr>`;
  r+=`<tr><td>Unit Cost</td><td>₹${fmt(budgetUnit)}</td><td>₹${fmt(actualUnit)}</td><td class="${actualUnit>budgetUnit?'text-danger':'text-safe'}">${actualUnit>=budgetUnit?'+':''}₹${fmt(actualUnit-budgetUnit)}</td></tr>`;
  r+=`<tr class="font-bold"><td>Total Variance</td><td></td><td></td><td class="${variance>0?'text-danger':'text-safe'}">${variance>=0?'+':''}₹${fmt(variance)}</td></tr>`;
  r+=`</tbody></table></div></div>`;
  r+=`<div class="result-box mt-8"><h4>Variance Decomposition</h4><p class="text-sm" style="color:var(--text2)">Price effect: <strong>${priceVar>=0?'+':''}₹${fmt(priceVar)}</strong> | Volume effect: <strong>${volVar>=0?'+':''}₹${fmt(volVar)}</strong> | Total: <strong>${variance>=0?'+':''}₹${fmt(variance)}</strong></p></div>`;
  document.getElementById('bv-result').innerHTML=r;
}

function calcSavings(){
  const cat=document.getElementById('sav-cat').value||'Category';
  const period=document.getElementById('sav-period').value||'Period';
  const baseline=nz(document.getElementById('sav-baseline').value);
  const current=nz(document.getElementById('sav-current').value);
  const avoid=nz(document.getElementById('sav-avoid').value);
  const process_=nz(document.getElementById('sav-process').value);
  const ve=nz(document.getElementById('sav-ve').value);
  const other=nz(document.getElementById('sav-other').value);

  const hardSavings=baseline-current;
  const softSavings=avoid+process_+ve+other;
  const totalSavings=hardSavings+softSavings;
  const savingsPct=baseline>0?(totalSavings/baseline)*100:0;
  const hardPct=baseline>0?(hardSavings/baseline)*100:0;

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Baseline Spend</div><div class="kv">₹${fmt(baseline)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Current Spend</div><div class="kv">₹${fmt(current)}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Total Savings</div><div class="kv">₹${fmt(totalSavings)}</div><div class="ks">${fmtPct(savingsPct)}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Hard Savings (Price)</div><div class="kv">₹${fmt(hardSavings)}</div><div class="ks">${fmtPct(hardPct)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Soft Savings (Other)</div><div class="kv">₹${fmt(softSavings)}</div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Savings Type</th><th>Amount</th><th>% of Baseline</th></tr></thead><tbody>`;
  r+=`<tr><td>Hard: Price Reduction</td><td>₹${fmt(hardSavings)}</td><td>${fmtPct(hardPct)}</td></tr>`;
  r+=`<tr><td>Soft: Cost Avoidance</td><td>₹${fmt(avoid)}</td><td>${fmtPct(baseline>0?(avoid/baseline)*100:0)}</td></tr>`;
  r+=`<tr><td>Soft: Process Efficiency</td><td>₹${fmt(process_)}</td><td>${fmtPct(baseline>0?(process_/baseline)*100:0)}</td></tr>`;
  r+=`<tr><td>Soft: Value Engineering</td><td>₹${fmt(ve)}</td><td>${fmtPct(baseline>0?(ve/baseline)*100:0)}</td></tr>`;
  r+=`<tr><td>Soft: Other</td><td>₹${fmt(other)}</td><td>${fmtPct(baseline>0?(other/baseline)*100:0)}</td></tr>`;
  r+=`<tr class="font-bold"><td>Total Savings</td><td>₹${fmt(totalSavings)}</td><td>${fmtPct(savingsPct)}</td></tr>`;
  r+=`</tbody></table></div></div>`;
  r+=`<div class="result-box mt-8"><h4>Savings Summary</h4><p class="text-sm" style="color:var(--text2)">${cat} (${period}): Total savings of <strong>₹${fmt(totalSavings)}</strong> (${fmtPct(savingsPct)} of baseline). Hard savings: ₹${fmt(hardSavings)}.</p></div>`;
  document.getElementById('sav-result').innerHTML=r;
}

  h+=`</div></div>`;
  h+=`<div class="mt-12"><button class="btn btn-pri" onclick="calcMultiYear()">Calculate Contract Cost</button></div>`;
  h+=`<div id="my-result"></div>`;
  h+=dnote("Multi-year contracts lock in pricing but reduce flexibility. Always calculate total contract value and cost per unit to compare against shorter-term or annual agreements.");
  h+=DISCLAIMER;
  return h;

function calcMultiYear(){
  const name=document.getElementById('my-name').value||'Contract';
  const years=nz(document.getElementById('my-years').value)||1;
  const basePrice=nz(document.getElementById('my-p1').value);
  const baseQty=nz(document.getElementById('my-q1').value);
  const esc=nz(document.getElementById('my-esc').value)/100;
  const qChg=nz(document.getElementById('my-qchg').value)/100;
  const gst=nz(document.getElementById('my-gst').value)/100;
  const signon=nz(document.getElementById('my-signon').value);
  const maint=nz(document.getElementById('my-maint').value);
  const disc=nz(document.getElementById('my-disc').value)/100;

  let r=`<div class="card mt-16"><div class="table-wrap"><table class="data-table"><thead><tr><th>Year</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Maintenance</th><th>Annual Total</th><th>Cumulative</th></tr></thead><tbody>`;
  let cumCost=signon;let totalQty=0;let totalValue=0;
  for(let y=1;y<=years;y++){
    const p=basePrice*Math.pow(1+esc,y-1);
    const q=baseQty*Math.pow(1+qChg,y-1);
    const discAmt=p*disc;
    const netP=p-discAmt;
    const sub=netP*q;
    const annMaint=maint;
    const annual=sub+annMaint;
    cumCost+=annual;totalQty+=q;totalValue+=sub;
    r+=`<tr><td class="font-bold">Year ${y}</td><td>₹${fmt(netP)}</td><td>${fmt(q)}</td><td>₹${fmt(sub)}</td><td>₹${fmt(annMaint)}</td><td>₹${fmt(annual)}</td><td>₹${fmt(cumCost)}</td></tr>`;
  }
  r+=`</tbody></table></div></div>`;
  const avgUnit=totalQty>0?totalValue/totalQty:0;
  const avgAnnual=years>0?cumCost/years:0;
  r+=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Total Contract Value</div><div class="kv">₹${fmt(cumCost)}</div><div class="ks">Incl sign-on ₹${fmt(signon)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Total Quantity</div><div class="kv">${fmt(totalQty)}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Avg Unit Cost</div><div class="kv">₹${fmt(avgUnit)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Avg Annual Spend</div><div class="kv">₹${fmt(avgAnnual)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Total with ${(gst*100).toFixed(0)}% GST</div><div class="kv">₹${fmt(cumCost*(1+gst))}</div></div>`;
  r+=`</div>`;
  document.getElementById('my-result').innerHTML=r;
}

  h+=`<div class="form-group"><label>GST Rate %</label><input id="gst-rate" type="number" value="" min="0" max="100" step="any"></div>`;

  h+=`<div class="form-group"><label>TCS % (if applicable)</label><input id="gst-tcs" type="number" value="" min="0" max="100" step="any"></div>`;
  h+=`</div></div>`;
  h+=`<div class="mt-12"><button class="btn btn-pri" onclick="calcGST()">Calculate Tax</button></div>`;
  h+=`<div id="gst-result"></div>`;
  h+=dnote("GST: Intra-state = CGST + SGST. Inter-state = IGST. ITC (Input Tax Credit) can offset output tax. Always verify HSN codes and applicable rates.");
  h+=DISCLAIMER;
  return h;
}
function calcGST(){
  const from=document.getElementById('gst-from').value||'Supplier State';
  const to=document.getElementById('gst-to').value||'Buyer State';
  const value=nz(document.getElementById('gst-value').value);
  const rate=nz(document.getElementById('gst-rate').value)/100;
  const tds=nz(document.getElementById('gst-tds').value)/100;
  const tcs=nz(document.getElementById('gst-tcs').value)/100;

  const intra=from.toLowerCase()===to.toLowerCase();
  const gstAmt=value*rate;
  const cgst=intra?gstAmt/2:0;
  const sgst=intra?gstAmt/2:0;
  const igst=intra?0:gstAmt;
  const tdsAmt=value*tds;
  const tcsAmt=value*tcs;
  const netPayable=value+gstAmt-tcsAmt;

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Taxable Value</div><div class="kv">₹${fmt(value)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Total GST</div><div class="kv">₹${fmt(gstAmt)}</div><div class="ks">${intra?'CGST + SGST':'IGST'}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Net Payable</div><div class="kv">₹${fmt(netPayable)}</div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Tax Component</th><th>Amount</th><th>Details</th></tr></thead><tbody>`;
  r+=`<tr><td>Taxable Value</td><td>₹${fmt(value)}</td><td>Base invoice value</td></tr>`;
  if(intra){
    r+=`<tr><td>CGST @${((rate/2)*100).toFixed(1)}%</td><td>₹${fmt(cgst)}</td><td>Central GST (intra-state)</td></tr>`;
    r+=`<tr><td>SGST @${((rate/2)*100).toFixed(1)}%</td><td>₹${fmt(sgst)}</td><td>State GST (intra-state)</td></tr>`;
  }else{
    r+=`<tr><td>IGST @${(rate*100).toFixed(1)}%</td><td>₹${fmt(igst)}</td><td>Integrated GST (inter-state)</td></tr>`;
  }
  if(tdsAmt>0)r+=`<tr><td>TDS @${(tds*100).toFixed(1)}%</td><td>₹${fmt(tdsAmt)}</td><td>Deducted at source</td></tr>`;
  if(tcsAmt>0)r+=`<tr><td>TCS @${(tcs*100).toFixed(1)}%</td><td>₹${fmt(tcsAmt)}</td><td>Collected at source</td></tr>`;
  r+=`<tr class="font-bold"><td>Total Payable</td><td>₹${fmt(value+gstAmt)}</td><td>${intra?'CGST + SGST':'IGST'}</td></tr>`;
  if(tcsAmt>0)r+=`<tr class="font-bold"><td>Net to Supplier</td><td>₹${fmt(netPayable)}</td><td>Incl TCS</td></tr>`;
  r+=`</tbody></table></div></div>`;
  r+=`<div class="result-box mt-8"><h4>GST Summary</h4><p class="text-sm" style="color:var(--text2)">Tax type: <strong>${intra?'Intra-state (CGST + SGST)':'Inter-state (IGST)'}</strong>. Total GST: <strong>₹${fmt(gstAmt)}</strong>. ${tdsAmt>0?'TDS: ₹'+fmt(tdsAmt)+'. ':''}${tcsAmt>0?'TCS: ₹'+fmt(tcsAmt)+'. ':''}Net payable: <strong>₹${fmt(netPayable)}</strong>.</p></div>`;
  document.getElementById('gst-result').innerHTML=r;
}
function loadGSTExample(){document.getElementById('gst-from').value='Maharashtra';document.getElementById('gst-to').value='Karnataka';document.getElementById('gst-value').value=4850000;document.getElementById('gst-rate').value=18;document.getElementById('gst-tds').value=0;document.getElementById('gst-tcs').value=0;calcGST()}

  h+=`<div id="fx-result"></div>`;
  h+=dnote("Use RBI reference rate for benchmarking. Hedging reduces risk but adds cost. Always compare hedged vs unhedged cost. Never use bank counter rates without comparison.");
  h+=DISCLAIMER;
  return h;
}
function calcFX(){
  const amt=nz(document.getElementById('fx-amt').value);
  const from=document.getElementById('fx-from').value||'USD';
  const to=document.getElementById('fx-to').value||'INR';
  const rate=nz(document.getElementById('fx-rate').value);
  const hedgePct=nz(document.getElementById('fx-hedge').value)/100;
  const bankCharges=nz(document.getElementById('fx-bank').value);
  const buyerRate=nz(document.getElementById('fx-buyer').value);

  const baseConvert=amt*rate;
  const hedgeCost=baseConvert*hedgePct;
  const totalHedged=baseConvert+hedgeCost+bankCharges;
  const buyerConvert=buyerRate>0?amt*buyerRate:0;
  const bankSpread=buyerRate>0?buyerRate-rate:0;

  let r=`<div class="kpi-grid mt-16">`;
  r+=`<div class="kpi"><div class="kl">Invoice Amount</div><div class="kv">${fmt(amt)} ${safe(from)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Exchange Rate</div><div class="kv">₹${fmt(rate)}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Base Conversion</div><div class="kv">₹${fmt(baseConvert)}</div></div>`;
  r+=`<div class="kpi"><div class="kl">Hedging + Bank Cost</div><div class="kv">₹${fmt(hedgeCost+bankCharges)}</div></div>`;
  r+=`<div class="kpi pos"><div class="kl">Total Cost (Hedged)</div><div class="kv">₹${fmt(totalHedged)}</div></div>`;
  if(buyerRate>0)r+=`<div class="kpi"><div class="kl">Bank Buyer Rate</div><div class="kv">₹${fmt(buyerRate)}</div><div class="ks">Spread: ₹${fmt(bankSpread)}/unit</div></div>`;
  r+=`</div>`;
  r+=`<div class="card mt-8"><div class="table-wrap"><table class="data-table"><thead><tr><th>Scenario</th><th>Amount (${safe(from)})</th><th>Rate</th><th>INR Amount</th><th>Extra Cost</th></tr></thead><tbody>`;
  r+=`<tr><td>Unhedged (Spot)</td><td>${fmt(amt)}</td><td>₹${fmt(rate)}</td><td>₹${fmt(baseConvert)}</td><td>₹0</td></tr>`;
  r+=`<tr><td>Hedged</td><td>${fmt(amt)}</td><td>₹${fmt(rate)} + ${(hedgePct*100).toFixed(1)}%</td><td>₹${fmt(baseConvert+hedgeCost)}</td><td>₹${fmt(hedgeCost)}</td></tr>`;
  r+=`<tr><td>Hedged + Bank Charges</td><td>${fmt(amt)}</td><td>—</td><td>₹${fmt(totalHedged)}</td><td>₹${fmt(hedgeCost+bankCharges)}</td></tr>`;
  if(buyerRate>0)r+=`<tr><td>At Bank Buyer Rate</td><td>${fmt(amt)}</td><td>₹${fmt(buyerRate)}</td><td>₹${fmt(buyerConvert)}</td><td>₹${fmt(buyerConvert-baseConvert)}</td></tr>`;
  r+=`</tbody></table></div></div>`;
  r+=`<div class="result-box mt-8"><h4>FX Summary</h4><p class="text-sm" style="color:var(--text2)">${fmt(amt)} ${safe(from)} at ₹${fmt(rate)} = <strong>₹${fmt(baseConvert)}</strong>. ${hedgePct>0?'With hedging: ₹'+fmt(totalHedged)+'. ':''}${bankCharges>0?'Bank charges: ₹'+fmt(bankCharges)+'. ':''}Always verify rate against RBI reference and compare across banks.</p></div>`;
  document.getElementById('fx-result').innerHTML=r;
}
function loadFXExample(){document.getElementById('fx-amt').value=50000;document.getElementById('fx-from').value='USD';document.getElementById('fx-to').value='INR';document.getElementById('fx-rate').value=83.50;document.getElementById('fx-hedge').value=1.5;document.getElementById('fx-bank').value=5000;document.getElementById('fx-buyer').value=83.85;calcFX()}

// ===== SAVINGS DASHBOARD (portfolio over saved comparisons)
// ============================================================
function rDashboard(){
  const quotes=Store.loadQuotes();
  const st=dashboardStats(quotes,1);
  let h='<div class="section-header"><h3>Your savings at a glance</h3><div class="actions"><button class="btn btn-sec" onclick="nav(\'home\')" style="font-size:11px">Back</button><button class="btn btn-pri btn-sm" onclick="window.print()">Print</button><button class="btn btn-pri btn-sm" onclick="newQuoteForm()">+ Compare Quotes</button></div></div>';
  h+='<div class="kpi-grid"><div class="kpi"><div class="kl">Comparisons saved</div><div class="kv">'+st.count+'</div><div class="ks">'+st.suppliers+' supplier quotes checked</div></div><div class="kpi pos"><div class="kl">You could save</div><div class="kv">₹'+fmt(st.totalSavings)+'</div><div class="ks">Cheapest vs costliest bid</div></div><div class="kpi"><div class="kl">Cheapest total price</div><div class="kv">₹'+fmt(st.totalValue)+'</div></div></div>';
  if(!st.rows.length){
    h+='<div class="card" style="text-align:center;padding:40px"><p class="text-sm text-muted">Nothing here yet. Save a quote comparison and it will show up here.</p><p style="margin-top:12px"><button class="btn btn-pri" onclick="newQuoteForm()">Compare quotes</button></p></div>';
    h+=DISCLAIMER;return h;
  }
  h+='<div class="card mb-16"><h4 style="font-size:13px;font-weight:700;margin-bottom:10px">How much each comparison saves (₹)</h4>'+svgBars(st.rows.map(r=>({label:r.name,value:r.savings,hot:true})),{aria:'savings by comparison'})+'</div>';
  h+='<div class="card mb-16"><h4 style="font-size:13px;font-weight:700;margin-bottom:10px">Your comparisons, cheapest first</h4><div class="table-wrap"><table class="data-table"><thead><tr><th>Comparison</th><th>Cheapest supplier</th><th>Price per unit</th><th>You save</th><th></th></tr></thead><tbody>';
  st.rows.forEach(r=>{
    h+='<tr><td class="font-bold">'+safe(r.name)+'</td><td>'+safe(r.best.name)+'</td><td>₹'+fmt(r.best.normUnit)+'</td><td class="font-bold text-safe">₹'+fmt(r.savings)+'</td><td><button class="btn btn-sm btn-ghost" onclick="viewResults('+r.qi+')">Open result</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+=dnote('Pick the cheapest normalized price, not the cheapest headline quote. The bar shows what you keep by choosing it.');
  h+=DISCLAIMER;return h;
}
function viewResults(i){const q=Store.loadQuotes()[Number(i)];if(!q||!q.suppliers||q.suppliers.length<2){alert('Need at least 2 suppliers.');return}window._qdata=q;nav('quotes');calcQuotes()}

// ============================================================
// ===== SAVED ITEMS
// ============================================================
function rSaved(){
  let h=`<div class="section-header"><h3>Saved Comparisons</h3><div class="actions"><button class="btn btn-sec" onclick="nav('home')" style="font-size:11px">Back</button><button class="btn btn-sec btn-sm" onclick="exportBackup()">Backup</button><label class="btn btn-sec btn-sm" style="cursor:pointer">Restore<input type="file" accept=".json,application/json" style="display:none" onchange="importBackupFile(this)"></label><button class="btn btn-pri btn-sm" onclick="window.print()">Print</button></div></div>`;
  const saved=Store.loadQuotes();
  if(saved.length===0){
    h+=`<div class="card" style="text-align:center;padding:40px"><p class="text-sm text-muted">No saved comparisons yet. Your work is safe here once saved — and Backup downloads a copy you can keep or move to another computer.</p></div>`;
  }else{
    h+=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Suppliers</th><th>Date</th><th></th></tr></thead><tbody>`;
    saved.forEach((q,i)=>{
      h+=`<tr><td class="font-bold">${safe(q.name)}</td><td>${q.suppliers.length}</td><td class="text-sm">${safe(q.date)}</td><td><button class="btn btn-sm btn-ghost" onclick="editQuote(${i})">View</button> <button class="btn btn-sm btn-ghost" onclick="viewResults(${i})">Result</button> <button class="btn btn-sm" style="color:var(--danger-t)" onclick="deleteSaved(${i})">Delete</button></td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  return h;
}
function deleteSaved(i){if(confirm('Delete this comparison?')){const s=Store.loadQuotes();i=Number(i);if(Number.isInteger(i)&&i>=0&&i<s.length){auditLog('delete',s[i].name);s.splice(i,1);Store.save('quotes',s)}nav('saved')}}

// ===== INIT
// ============================================================
document.addEventListener('DOMContentLoaded',function(){
  const savedTheme=Store.load('theme');
  if(savedTheme==='dark'){document.body.classList.add('dark')}
  if(!Store.load('quotes'))Store.save('quotes',[]);
  if(!Store.load('scorecards'))Store.save('scorecards',[]);
  try{if('serviceWorker' in navigator&&(location.protocol==='http:'||location.protocol==='https:'))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
  try{
    if(location.hash&&location.hash.indexOf('#q=')===0){
      const q=decodeQuote(location.hash.slice(3));
      if(q){window._qdata=q;nav('quotes');calcQuotes();history.replaceState(null,'',location.pathname+location.search);return}
    }
  }catch(e){}
  nav('home');
});
</script>
